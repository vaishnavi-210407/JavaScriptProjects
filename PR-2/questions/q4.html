<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prime Numbers</title>
</head>
<body>
    
    <h1>Prime Numbers</h1>
    <h2 id = "start"></h2>
    <h2 id = "end"></h2>

    <script>

        let start = Number(prompt("Enter start number : "));
        document.getElementById("start").innerText = `start = ${start}`;

        let end = Number(prompt("Enter end number : "));
        document.getElementById("end").innerText = `end = ${end}`;

        for(let num = start; num <= end; num++) {

            let isPrime = true;
            if(num < 2) continue;

            for(let i = 2; i < num; i++) {
                if(num % i === 0) {
                    isPrime = false;
                    break;
                }
            }
            if(isPrime) {
               document.write(num + "<br>");
            }
         }

    </script>

</body>
</html>
