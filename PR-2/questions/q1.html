<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leap Year</title>
</head>
<body>
    <h1>Leap Year</h1>
    <h2 id="start"></h2>
    <h2 id="end"></h2>
    <script>
        let start = Number(prompt("Enter start year : "));
        document.getElementById("start").innerText = `start year : ${start}`;

        let end = Number(prompt("Enter end year : "));
        document.getElementById("end").innerText = `end : ${end}`;

        for(let year = start; year <= end; year++) {
            if((year % 400 === 0) || (year % 4 === 0 && year % 100 !== 0)) {
                document.write(year + "<br>");
            }
        }
    </script>

</body>
</html>
