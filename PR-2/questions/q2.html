<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
</head>
<body>
    <h1>Multiplication Table</h1>
    <h2 id = "num"></h2>
    
    <script>
        let num = Number(prompt("Enter a number : "));
        document.getElementById("num").innerText = `Number : ${num}`;

        for (let i = 1; i <= 10; i++) {
            document.write(num + " x " + i + " = " + (num * i) + "<br>");
        }
    </script>
</body>
</html>
