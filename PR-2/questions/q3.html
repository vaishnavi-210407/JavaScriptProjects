<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fibonacci</title>
</head>
<body>
    
    <h1>Fibonacci Series</h1>
    <h2 id = "a"></h2>
    <h2 id = "b"></h2>
    <h2 id = "n"></h2>

    <script>
        let a = Number(prompt("Enter first number : "));
        document.getElementById("a").innerText = `a ${a}`;

        let b = Number(prompt("Enter Second number : "));
        document.getElementById("b").innerText = `b ${b}`;

        let n = Number(prompt("Enter number of terms : "));
        document.getElementById("n").innerText = `n ${n}`;

        document.write(a + "<br>");
        document.write(b + "<br>");

        for(let i = 3; i <= n; i++) {
            let c = a + b;
            document.write(c + "<br>");
            a = b;
            b = c;
        }
    </script>

</body>
</html>
