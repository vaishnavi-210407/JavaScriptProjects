<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Product List</title>

  <link rel="stylesheet" href="./assets/css/style.css">
  <link rel="stylesheet" href="./assets/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>

<body class="bg-light p-4">

  <div class="container">
    <div class="row justify-content-center">
      
      <div class="col-md-6">
        <div class="card p-4 shadow">

          <h3 class="text-center mb-3">Add Product</h3>

          <form id="productForm">
            
            <input type="text" id="name" placeholder="Product Name" class="form-control mb-3" required>

            <input type="url" id="url" placeholder="Image URL" class="form-control mb-3" required>

            <input type="number" id="price" placeholder="Price" class="form-control mb-3" required>

            <button type="submit" class="btn btn-primary w-100">
              Add Product
            </button>

          </form>

        </div>
      </div>

    </div>
  </div>

  <script src="./assets/js/index.js"></script>
  <script src="./assets/js/bootstrap.bundle.js"></script>

</body>
</html>
