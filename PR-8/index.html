<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Product List</title>

  <link rel="stylesheet" href="./assets/css/style.css">
  <link rel="stylesheet" href="./assets/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>

<body class="bg-dark d-flex align-items-center justify-content-center" style="height:100vh;">

  <div class="card shadow-lg p-4" style="width: 400px; border-radius:15px;">
    
    <h3 class="text-center mb-3 text-primary">🛍 Add Product</h3>

    <form id="productForm">
      
      <input type="text" id="name" placeholder="Product Name" class="form-control mb-3">

      <input type="url" id="url" placeholder="Image URL" class="form-control mb-3">

      <input type="number" id="price" placeholder="Price ₹" class="form-control mb-3">

      <button type="submit" class="btn btn-primary w-100 fw-bold">
        ➕ Add Product
      </button>

    </form>

  </div>

  <script src="./assets/js/index.js"></script>
  <script src="./assets/js/bootstrap.bundle.js"></script>

</body>
</html>
